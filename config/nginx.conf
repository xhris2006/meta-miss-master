# Nginx config — Reines du Meta — optimisé pour 20 000+ utilisateurs simultanés

# Nombre de workers = nombre de vCPU
worker_processes auto;

# Limite de fichiers ouverts par worker
worker_rlimit_nofile 65535;

events {
  worker_connections 4096;    # 4096 × workers = très haute concurrence
  use epoll;                  # Linux — meilleur perf pour I/O
  multi_accept on;
}

http {
  include       mime.types;
  default_type  application/octet-stream;

  # ── Performances de base ──────────────────────────────────────────────────
  sendfile           on;
  tcp_nopush         on;
  tcp_nodelay        on;
  keepalive_timeout  75s;
  keepalive_requests 200;

  # ── Compression gzip ─────────────────────────────────────────────────────
  gzip on;
  gzip_comp_level   5;
  gzip_min_length   1000;
  gzip_proxied      any;
  gzip_vary         on;
  gzip_types
    text/plain
    text/css
    application/json
    application/javascript
    text/xml
    application/xml
    image/svg+xml
    application/x-font-ttf
    font/opentype;

  # ── Timeouts ─────────────────────────────────────────────────────────────
  client_body_timeout   30s;
  client_header_timeout 30s;
  send_timeout          60s;
  proxy_connect_timeout 10s;
  proxy_read_timeout    60s;

  # ── Buffers ──────────────────────────────────────────────────────────────
  client_max_body_size  10m;     # photos jusqu'à 10 Mo
  client_body_buffer_size 128k;
  proxy_buffer_size     128k;
  proxy_buffers       4 256k;
  proxy_busy_buffers_size 256k;

  # ── Rate limiting Nginx (couche supplémentaire avant Node.js) ────────────
  limit_req_zone $binary_remote_addr zone=api:10m    rate=60r/m;
  limit_req_zone $binary_remote_addr zone=auth:10m   rate=10r/m;
  limit_req_zone $binary_remote_addr zone=payment:10m rate=5r/m;
  limit_conn_zone $binary_remote_addr zone=conn:10m;

  # ── Logs ─────────────────────────────────────────────────────────────────
  log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                  '$status $body_bytes_sent "$http_referer" '
                  '"$http_user_agent" rt=$request_time';
  access_log /var/log/nginx/access.log main;
  error_log  /var/log/nginx/error.log  warn;

  # ── Upstream backend (Node.js) ───────────────────────────────────────────
  upstream backend {
    server 127.0.0.1:5000;
    keepalive 32;              # connexions keep-alive vers Node.js
  }

  # ── Upstream frontend (Next.js) ──────────────────────────────────────────
  upstream frontend {
    server 127.0.0.1:3000;
    keepalive 16;
  }

  server {
    listen 80;
    listen [::]:80;
    server_name metavote.online www.metavote.online;

    # Rediriger HTTP → HTTPS
    return 301 https://$host$request_uri;
  }

  server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name metavote.online www.metavote.online;

    ssl_certificate     /etc/letsencrypt/live/metavote.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/metavote.online/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # ── Security headers ──────────────────────────────────────────────────
    add_header X-Frame-Options        "SAMEORIGIN"   always;
    add_header X-Content-Type-Options "nosniff"      always;
    add_header X-XSS-Protection       "1; mode=block" always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy     "camera=(), microphone=(), geolocation=()" always;

    # ── Health check (pas de rate limit) ─────────────────────────────────
    location = /health {
      proxy_pass http://backend;
      proxy_set_header Host $host;
      access_log off;
    }

    # ── API backend ───────────────────────────────────────────────────────
    location /api/ {
      limit_req zone=api burst=30 nodelay;
      limit_conn conn 20;

      proxy_pass         http://backend;
      proxy_http_version 1.1;
      proxy_set_header   Upgrade    $http_upgrade;
      proxy_set_header   Connection "upgrade";
      proxy_set_header   Host       $host;
      proxy_set_header   X-Real-IP  $remote_addr;
      proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;

      # Pas de cache sur l'API (sauf /api/ranking géré côté Node)
      add_header Cache-Control "no-store, no-cache" always;
    }

    # ── Auth — rate limit strict ──────────────────────────────────────────
    location ~* ^/api/(auth|admin) {
      limit_req zone=auth burst=5 nodelay;
      limit_conn conn 5;
      proxy_pass http://backend;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Paiement — rate limit très strict ────────────────────────────────
    location /api/payments/ {
      limit_req zone=payment burst=3 nodelay;
      proxy_pass http://backend;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Socket.io ────────────────────────────────────────────────────────
    location /socket.io/ {
      proxy_pass         http://backend;
      proxy_http_version 1.1;
      proxy_set_header   Upgrade    $http_upgrade;
      proxy_set_header   Connection "upgrade";
      proxy_set_header   Host       $host;
      proxy_set_header   X-Real-IP  $remote_addr;
      proxy_cache_bypass $http_upgrade;
      proxy_read_timeout 3600s;  # garder les connexions WebSocket longtemps
    }

    # ── Uploads statiques (Cloudinary gère, mais garde le fallback) ──────
    location /uploads/ {
      alias /app/backend/uploads/;
      expires 30d;
      add_header Cache-Control "public, immutable";
      add_header X-Content-Type-Options nosniff;
      try_files $uri =404;
    }

    # ── Assets Next.js (_next/static) — cache agressif ───────────────────
    location /_next/static/ {
      proxy_pass http://frontend;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      expires 1y;
      add_header Cache-Control "public, immutable";
      access_log off;
    }

    # ── Frontend Next.js ─────────────────────────────────────────────────
    location / {
      proxy_pass         http://frontend;
      proxy_http_version 1.1;
      proxy_set_header   Host       $host;
      proxy_set_header   X-Real-IP  $remote_addr;
      proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
      proxy_cache_bypass $http_upgrade;
    }
  }
}
